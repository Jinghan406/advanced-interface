<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Gaby · Advanced Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Fragment+Mono&display=swap">
<style>
/* Layout: a studio index. Weeks stack as chapters; each set is a card whose cover is a capture of the prototype itself. A card opens the submitted prototype; a second link opens its Figma frame. */
:root {
  --bg: #f5f5f3; --surface: #ffffff; --fg: #17181b; --soft: #6c6e74; --line: #e3e3df; --accent: #2f55ff;
  --ui: "Onest", "Helvetica Neue", Arial, sans-serif; --mono: "Fragment Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111214; --surface: #191a1d; --fg: #ededee; --soft: #9a9ca3; --line: #2a2b30; --accent: #7d95ff; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #111214; --surface: #191a1d; --fg: #ededee; --soft: #9a9ca3; --line: #2a2b30; --accent: #7d95ff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--ui); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: max(16px, 4vw); padding-block: 48px 96px; display: grid; gap: 64px; }

.intro { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px 48px; align-items: end; }
.eyebrow { font: 400 12px/1.4 var(--mono); color: var(--soft); letter-spacing: .04em; margin: 0 0 18px; }
h1 { font: 500 clamp(44px, 7vw, 84px)/.95 var(--ui); letter-spacing: -.045em; margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--soft); max-width: 46ch; }
.weeknav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.weeknav a { font: 500 13px var(--ui); text-decoration: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 999px; }
.weeknav a:hover { border-color: var(--fg); }

.weeks { display: grid; gap: 72px; }
.week { display: grid; gap: 22px; scroll-margin-top: 24px; }
.whead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 24px; align-items: baseline; border-top: 1px solid var(--fg); padding-top: 16px; }
.wnum { font: 400 13px var(--mono); color: var(--soft); }
.whead h2 { font: 500 30px/1.1 var(--ui); letter-spacing: -.025em; margin: 0; }
.whead .brief { grid-column: 2; margin: 0; color: var(--soft); font-size: 14px; max-width: 64ch; }
.whead > a { font: 400 12px var(--mono); color: var(--accent); text-decoration: none; white-space: nowrap; }
.whead > a:hover { text-decoration: underline; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 18px; }
.set { display: grid; gap: 10px; align-content: start; min-width: 0; }
.cover { display: block; position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
.cover:hover img { transform: scale(1.035); }
.cover .go { position: absolute; right: 10px; bottom: 10px; font: 500 12px var(--ui); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 11px; opacity: 0; transform: translateY(4px); transition: .25s; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.cover:hover .go, .cover:focus-visible .go { opacity: 1; transform: none; }
.cover:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.meta { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.meta b { font: 500 16px/1.3 var(--ui); }
.meta span { font: 400 12px var(--mono); color: var(--soft); text-align: right; }
.note { margin: -4px 0 0; font-size: 13.5px; color: var(--soft); }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.links a { font: 400 11.5px var(--mono); text-decoration: none; color: var(--soft); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
.links a:hover { color: var(--fg); border-color: var(--fg); }
.links a:focus-visible, .weeknav a:focus-visible, .whead > a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 720px) { .intro { grid-template-columns: 1fr; } .whead { grid-template-columns: 1fr; } .whead .brief { grid-column: 1; } }
@media (prefers-reduced-motion: reduce) { .cover img, .cover .go { transition: none; } }

/* in-page viewer */
[hidden] { display: none !important; }
button.cover { padding: 0; cursor: pointer; width: 100%; font: inherit; color: inherit; }
.links button { font: 400 11.5px var(--mono); color: var(--soft); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
.links button:hover { color: var(--fg); border-color: var(--fg); }
.viewer { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }
.vbar { display: flex; align-items: center; gap: 10px; padding: 10px max(16px, 2vw); border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
.vbar button, .vbar a { font: 500 13px var(--ui); color: var(--fg); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.vbar button:hover, .vbar a:hover { border-color: var(--fg); }
.vbar button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.vbar :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vtitle { flex: 1; min-width: 0; display: flex; gap: 10px; align-items: baseline; overflow: hidden; }
.vtitle b { font: 500 15px var(--ui); white-space: nowrap; }
.vtitle span { font: 400 12px var(--mono); color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vvars { display: flex; gap: 6px; }
.viewer iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--surface); }
@media (max-width: 720px) { .vtitle span, .vbar .wide { display: none; } }
</style>

<div class="wrap">
  <header class="intro">
    <div>
      <p class="eyebrow">ArtCenter · Form and Content · FA2026 · Dan Park</p>
      <h1>Advanced Interface</h1>
    </div>
    <div>
      <p>Gaby Feng's weekly UI component studies. Each week is one component type, drawn in Figma and built as a working prototype, in several tones.</p>
      <nav class="weeknav" id="weeknav" aria-label="Weeks"></nav>
    </div>
  </header>
  <div class="weeks" id="weeks"></div>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="v-name">
  <div class="vbar">
    <button type="button" id="v-back">← All work</button>
    <div class="vtitle"><b id="v-name"></b><span id="v-meta"></span></div>
    <div class="vvars" id="v-vars"></div>
    <a id="v-fig" class="wide" href="#" target="_blank" rel="noopener">Figma ↗</a>
    <button type="button" id="v-prev" aria-label="Previous set">←</button>
    <button type="button" id="v-next" aria-label="Next set">→</button>
  </div>
  <iframe id="v-frame" title="Prototype"></iframe>
</div>


<script>
/* To add a week: put a new entry at the top of WEEKS, its pages under p/ and its covers under covers/. */
const FIG = 'https://www.figma.com/design/i4NyKNmLDgHOhEJ0ypeuO6/week1-Progress-Bar?node-id=';
const WEEKS = [
  { id: 'w3', n: 'Week 3', title: 'Selectors', page: '224-2',
    brief: 'Four sets of a switch, a checkbox and a radio button, each in a list with labels, off → on and back, with full spec.',
    sets: [
      { id: 'w3-lava', name: 'Lava', tone: 'Minimal', fig: '224-3', note: 'Liquid metaballs pour, drop and drift between states.' },
      { id: 'w3-precision', name: 'Precision', tone: 'Futuristic', fig: '238-2', note: 'Graphite and one band of light; every control morphs.' },
      { id: 'w3-ink', name: 'Ink line', tone: 'Intimate', fig: '239-2', note: 'Pen-drawn controls that ink on and erase backward.' },
      { id: 'w3-rally', name: 'Rally', tone: 'Energetic', fig: '229-2', note: 'Sports poster: slam switch, stamp check, bouncing ball.' }
    ] },
  { id: 'w2', n: 'Week 2', title: 'Badges & Tooltips', page: '95-2',
    brief: 'Five sets of a badge and a tooltip. Badge: dot and with content, in and out. Tooltip: plain and rich with an action.',
    sets: [
      { id: 'w2-bud-drip', name: 'Bud & Drip', tone: 'Minimal', fig: '95-3', note: 'A badge buds off the icon; a tooltip drips into place.',
        vars: [['Dark', 'w2-bud-drip'], ['Light', 'w2-bud-drip-light'], ['Colour', 'w2-bud-drip-colour']] },
      { id: 'w2-emote-chat', name: 'Emote & Chat', tone: 'Playful', fig: '121-2', note: 'Pixel farm: emote bubbles and a dialogue box.' },
      { id: 'w2-lock-on', name: 'Lock-on & Callout', tone: 'Futuristic', fig: '146-2', note: 'Starship HUD with brackets that lock on.' },
      { id: 'w2-circled-noted', name: 'Circled & Noted', tone: 'Intimate', fig: '154-2', note: 'A notebook: red-pen circles and sticky notes.' },
      { id: 'w2-seal-card', name: 'Seal & Card', tone: 'Luxurious', fig: '173-2', note: 'Hotel concierge: gold coins and a wax-sealed card.' }
    ] },
  { id: 'w1', n: 'Week 1', title: 'Progress Indicators', page: '0-1',
    brief: 'Three sets of an indeterminate and a determinate indicator, through zero, progress and complete.',
    sets: [
      { id: 'w1-cluster', name: 'Cluster & Mass', tone: 'Minimal', fig: '2-68', note: 'Soft bodies merge and part, then set the word DESIGN.' },
      { id: 'w1-lens', name: 'Lens & Column', tone: 'Elegant', fig: '2-2', note: 'Rendered optical glass: a lens and a vial of water.' },
      { id: 'w1-uplink', name: 'Uplink & Core', tone: 'Cyberpunk', fig: '2-35', note: 'A neon HUD: a charge runs the track, a ring fills.' }
    ] }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ext = 'target="_blank" rel="noopener"';
const $ = id => document.getElementById(id);
const ALL = [];
WEEKS.forEach(w => {
  w.sets.forEach(s => ALL.push({ ...s, week: w }));
  $('weeknav').insertAdjacentHTML('beforeend', `<a href="#${w.id}">${w.n} · ${esc(w.title)}</a>`);
  $('weeks').insertAdjacentHTML('beforeend', `<section class="week" id="${w.id}" aria-labelledby="h-${w.id}">
    <div class="whead"><span class="wnum">${w.n}</span><h2 id="h-${w.id}">${esc(w.title)}</h2>
      <a href="${FIG + w.page}" ${ext}>Figma page ↗</a><p class="brief">${esc(w.brief)}</p></div>
    <div class="grid">${w.sets.map(s => `<article class="set">
      <button type="button" class="cover" data-open="${s.id}" aria-label="View ${esc(s.name)}"><img src="covers/${s.id}.jpg" alt="" loading="lazy"><span class="go">View prototype</span></button>
      <div class="meta"><b>${esc(s.name)}</b><span>${esc(s.tone)}</span></div>
      <p class="note">${esc(s.note)}</p>
      <div class="links"><button type="button" data-open="${s.id}">Prototype</button><a href="${FIG + s.fig}" ${ext}>Figma ↗</a>${(s.vars || []).slice(1).map(([t, f]) => `<button type="button" data-open="${s.id}" data-file="${f}">${t} version</button>`).join('')}</div>
    </article>`).join('')}</div></section>`);
});

let cur = -1, opener = null;
function show(i, file, push = true) {
  cur = (i + ALL.length) % ALL.length; const s = ALL[cur]; file = file || s.id;
  $('v-name').textContent = s.name; $('v-meta').textContent = `${s.week.n} · ${s.week.title} · ${s.tone}`;
  $('v-fig').href = FIG + s.fig;
  $('v-vars').innerHTML = (s.vars || []).map(([t, f]) => `<button type="button" data-var="${f}" aria-pressed="${f === file}">${t}</button>`).join('');
  const src = `p/${file}.html`; if ($('v-frame').getAttribute('src') !== src) $('v-frame').src = src;
  if ($('viewer').hidden) { opener = document.activeElement; $('viewer').hidden = false; document.body.style.overflow = 'hidden'; $('v-back').focus(); }
  if (push) { try { history.replaceState(null, '', '#' + file); } catch (e) {} }
}
function close() {
  $('viewer').hidden = true; document.body.style.overflow = ''; $('v-frame').removeAttribute('src');
  const id = ALL[cur]?.id; cur = -1;
  try { history.replaceState(null, '', location.pathname + '#' + id.slice(0, 2)); } catch (e) {}
  (document.querySelector(`.cover[data-open="${id}"]`) || opener)?.focus?.();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (b) { show(ALL.findIndex(s => s.id === b.dataset.open), b.dataset.file); return; }
  const v = e.target.closest('[data-var]'); if (v) show(cur, v.dataset.var);
});
$('v-back').onclick = close; $('v-prev').onclick = () => show(cur - 1); $('v-next').onclick = () => show(cur + 1);
addEventListener('keydown', e => { if ($('viewer').hidden) return; if (e.key === 'Escape') close(); });
const h = location.hash.slice(1);
if (h) { const i = ALL.findIndex(s => s.id === h || (s.vars || []).some(v => v[1] === h)); if (i >= 0) show(i, h, false); }
</script>

</body>
</html>
