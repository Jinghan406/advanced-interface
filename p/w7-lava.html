<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>W7 Toolbar · Lava</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){body{padding-left:40px;padding-right:40px}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus,button:focus-visible{outline:none}
.wrap{max-width:1160px;margin:0 auto;padding:48px 0 120px;display:flex;flex-direction:column;gap:72px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px}
.eyebrow{margin:0;font:500 11px/1.5 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top h1{margin:12px 0 0;font-family:var(--f-disp);font-weight:var(--h1-w,400);font-style:var(--h1-fs,normal);font-size:clamp(46px,8.5vw,var(--h1-max,96px));line-height:.95;letter-spacing:var(--h1-ls,-.02em);text-transform:var(--h1-tt,none);color:var(--h1-c,var(--ink))}
.top .tone{margin:14px 0 0;font:400 15px/1.55 var(--f-body);color:var(--muted);max-width:56ch;text-wrap:pretty}
.toneword{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.toneword span{font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.toneword b{font-family:var(--f-disp);font-weight:var(--h1-w,400);font-style:var(--h1-fs,normal);font-size:28px;line-height:1;color:var(--accent,var(--ink));text-transform:var(--h1-tt,none)}

.sec{display:flex;flex-direction:column;gap:20px}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin:0}
.sec-h h2{margin:0;font-family:var(--f-disp);font-weight:var(--h2-w,400);font-style:var(--h1-fs,normal);font-size:24px;line-height:1.2;text-transform:var(--h1-tt,none)}
.sec-h span{font:500 10px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.dstage{position:relative;background:var(--stage);padding:40px clamp(12px,3vw,32px) 24px;display:flex;flex-direction:column;align-items:center;gap:20px;border-radius:var(--stage-r,0)}
.win{position:relative;width:100%;max-width:980px;height:500px;background:var(--win-bg);border:1px solid var(--win-line,var(--line));border-radius:var(--win-r,12px);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--win-sh,none);isolation:isolate}
.tbar{flex:none;height:38px;display:flex;align-items:center;gap:8px;padding:0 16px;position:relative;border-bottom:1px solid var(--win-line,var(--line))}
.tbar i{width:10px;height:10px;border-radius:50%;background:var(--win-line,var(--line))}
.tbar b{position:absolute;left:0;right:0;text-align:center;font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.wtb{position:relative;z-index:3;flex:none}
.wbody{position:relative;flex:1;min-height:0;overflow:hidden;z-index:1}
.wb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;pointer-events:none}
.wb-k{font:500 10px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.wb-v{font-family:var(--f-disp);font-weight:var(--h1-w,400);font-style:var(--h1-fs,normal);text-transform:var(--h1-tt,none);font-size:clamp(40px,7vw,76px);line-height:1;color:var(--wb-c,var(--ink));letter-spacing:var(--h1-ls,-.02em)}
.wb-s{font:400 12px/1.4 var(--f-mono);color:var(--muted)}
.toast{position:absolute;left:50%;bottom:22px;translate:-50% 8px;opacity:0;pointer-events:none;z-index:5;font:500 12px/1 var(--f-mono);letter-spacing:.06em;padding:10px 14px;border-radius:var(--toast-r,6px);background:var(--toast-bg,var(--ink));color:var(--toast-c,var(--page));transition:opacity .25s,translate .25s;white-space:nowrap}
.toast.show{opacity:1;translate:-50% 0}

.ctrls{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:center}
.seg{display:flex;align-items:center;gap:6px}
.seg>span{font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.seg button{font:500 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:9px 12px;border-radius:var(--seg-r,999px);transition:color .2s,border-color .2s,background .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--seg-on-c,var(--page));background:var(--seg-on,var(--ink));border-color:var(--seg-on,var(--ink))}
.hint{margin:0;font:500 10px/1.7 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;max-width:760px}

.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:20px}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.cap{margin:0;display:flex;justify-content:space-between;gap:8px;font:500 10px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cap i{font-style:normal;opacity:.7}
.pv{position:relative;display:flex;align-items:center;padding:36px 20px;background:var(--pv-bg,var(--stage));border-radius:var(--stage-r,0);overflow:hidden;min-height:150px}
.pv>.tb{flex:1}

.spec{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.spec{grid-template-columns:1fr}}
.specpv{padding:92px 56px 110px 64px;overflow:visible}
.specpv>.tb{flex:none;width:100%}
.rl{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:visible}
.rl text{font:500 10px var(--f-mono);fill:var(--rl,#ff4d4d)}
.rl line,.rl path{stroke:var(--rl,#ff4d4d);stroke-width:1;fill:none}
.tbl{width:100%;border-collapse:collapse;font:400 12px/1.5 var(--f-mono)}
.tbl th,.tbl td{text-align:left;padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:500;color:var(--muted);letter-spacing:.06em;width:44%;padding-right:12px}
.tbl td{color:var(--ink)}
.tbl tr.grp th{padding-top:22px;color:var(--ink);letter-spacing:.14em;text-transform:uppercase;font-size:10px;border-bottom-color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px;border:1px solid var(--line)}

/* toolbar system */
.tb{position:relative;width:100%;height:var(--bar-h);isolation:isolate;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.tb.static{pointer-events:none}
.tb-bg{position:absolute;inset:0;z-index:0;border-radius:var(--bar-r,0);overflow:hidden}
.tb-bg canvas,.tb-fx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tb-fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.tb-row{position:relative;z-index:2;height:100%;display:flex;align-items:center;padding:0 var(--bar-px)}
.tb[data-align="center"] .tb-row{justify-content:center}
.tb[data-align="right"] .tb-row{justify-content:flex-end}
.tb-grp{display:flex;align-items:center;gap:var(--gap)}
.tb-fx2{position:absolute;inset:0;z-index:3;pointer-events:none}
.tbi{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--ic-gap);height:var(--btn-h);padding:0 var(--btn-px);border-radius:var(--btn-r);font:var(--lab-font);letter-spacing:var(--lab-ls,0);text-transform:var(--lab-tt,none);white-space:nowrap;color:var(--btn-c,inherit)}
.tb[data-content="icon"] .tbi{width:var(--btn-h);padding:0}
.tb[data-content="icon"] .tl{display:none}
.tb[data-content="text"] .ic{display:none}
.ic{display:block;flex:none;width:var(--ic);height:var(--ic);fill:none;stroke:currentColor;stroke-width:var(--stroke);stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.tl{display:block}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

.toneword .ver{margin-top:6px;color:var(--ink);opacity:.8}

html{overflow-x:hidden}
.wrap{counter-reset:sec}
.wrap.has-hero{padding-top:0}
.sec-h h2::before{counter-increment:sec;content:counter(sec,decimal-leading-zero);font:500 11px/1 var(--f-mono);letter-spacing:.14em;color:var(--muted);margin-right:14px;vertical-align:.45em;font-style:normal}
.hero{position:relative;height:clamp(500px,72vh,700px);margin:0 calc(50% - 50vw);overflow:hidden;background:var(--hero-bg,#000);isolation:isolate}
.note{margin:2px 0 0;font:400 13px/1.55 var(--f-body);color:var(--muted);max-width:44ch;text-wrap:pretty}
.win{height:var(--win-h,500px)}
.top[hidden]{display:none!important}
</style></head><body><main id="app"></main>
<script>/* W7 toolbar system — shared structure. Each theme supplies THEME = {num,title,tone,blurb,hint,init(tb),specExtra,...} */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const DPR=()=>Math.min(2,window.devicePixelRatio||1);
/* spring helper: s={x,v}; returns x */
function spring(s,target,k,c,dt){s.v+=(target-s.x)*k*dt;s.v*=Math.exp(-c*dt);s.x+=s.v*dt;return s.x}
const SP=(x=0)=>({x,v:0});

const ICONS={
  select:'<path d="M6 3.5l12.5 7.2-5.6 1.6-2.6 5.4z"/>',
  draw:'<path d="M4.5 19.5l3.6-.9L18.6 8.1a2 2 0 0 0 0-2.8l-.0-.0a2 2 0 0 0-2.8 0L5.4 15.8z"/><path d="M14.2 6.8l3 3"/>',
  text:'<path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/>',
  crop:'<path d="M7 3v14h14"/><path d="M3 7h14v14"/>',
  share:'<path d="M12 4v11"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M5 13.5V20h14v-6.5"/>'
};
const ITEMS=[{id:'select',label:'Select'},{id:'draw',label:'Draw'},{id:'text',label:'Text'},{id:'crop',label:'Crop'},{id:'share',label:'Share'}];
const icon=id=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg>`;

const ALL=[];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.target._tb)e.target._tb.visible=e.isIntersecting}),{rootMargin:'120px'});

class Toolbar{
  constructor(host,o={}){
    this.o=o;this.items=o.items||ITEMS;
    const el=this.el=h('div','tb');el._tb=this;
    el.dataset.align=o.align||'left';el.dataset.content=o.content||'both';
    el.innerHTML='<div class="tb-bg"></div><div class="tb-fx"></div><div class="tb-row"><div class="tb-grp"></div></div><div class="tb-fx2"></div>';
    [this.bg,this.fx,this.row,this.fx2]=[el.children[0],el.children[1],el.children[2],el.children[3]];
    this.grp=this.row.firstChild;
    this.btns=this.items.map((it,i)=>{const b=h('button','tbi',icon(it.id)+`<span class="tl">${it.label}</span>`);b.type='button';b.setAttribute('aria-label',it.label);b.dataset.i=i;b._item=it;this.grp.appendChild(b);return b});
    this.state={hover:null,press:null,px:null,py:null,inside:false};
    host.appendChild(el);
    this.visible=true;
    if(o.forced||o.still)el.classList.add('static');
    if(o.forced){const b=this.btns[o.forced.i];this.state.hover=b;b.classList.add('hov');if(o.forced.press){this.state.press=b;b.classList.add('prs')}}
    this.fxi=(THEME.init&&THEME.init(this))||{};
    if(!o.forced&&!o.still)this.bind();
    requestAnimationFrame(()=>{
      this.fxi.layout&&this.fxi.layout();
      if(o.forced){const b=this.state.hover,r=this.rect(b);this.state.px=r.cx;this.state.py=r.cy;this.state.inside=true;
        this.fxi.hover&&this.fxi.hover(b,true);if(o.forced.press&&this.fxi.press)this.fxi.press(b,true)}
    });
    new ResizeObserver(()=>this.fxi.layout&&this.fxi.layout()).observe(el);
    io.observe(el);ALL.push(this);
  }
  bind(){
    const el=this.el;
    el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();this.state.px=e.clientX-r.left;this.state.py=e.clientY-r.top;this.state.inside=true;this.fxi.move&&this.fxi.move(this.state.px,this.state.py)});
    el.addEventListener('pointerleave',()=>{this.state.inside=false;this.setHover(null)});
    this.btns.forEach(b=>{
      b.addEventListener('pointerenter',()=>this.setHover(b));
      b.addEventListener('pointerleave',()=>{if(this.state.hover===b)this.setHover(null)});
      b.addEventListener('pointerdown',()=>this.setPress(b));
      b.addEventListener('click',()=>this.o.onAction&&this.o.onAction(b._item,b));
    });
    const up=()=>this.setPress(null);
    window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  }
  setHover(b){const s=this.state;if(s.hover===b)return;const o=s.hover;if(o){o.classList.remove('hov');this.fxi.hover&&this.fxi.hover(o,false)}s.hover=b;if(b){b.classList.add('hov');this.fxi.hover&&this.fxi.hover(b,true)}}
  setPress(b){const s=this.state;if(s.press===b)return;const o=s.press;if(o){o.classList.remove('prs');this.fxi.press&&this.fxi.press(o,false)}s.press=b;if(b){b.classList.add('prs');this.fxi.press&&this.fxi.press(b,true)}}
  rect(b){if(this.o.flat)return{x:b.offsetLeft,y:b.offsetTop,w:b.offsetWidth,h:b.offsetHeight,cx:b.offsetLeft+b.offsetWidth/2,cy:b.offsetTop+b.offsetHeight/2};const r=this.el.getBoundingClientRect(),q=b.getBoundingClientRect();const x=q.left-r.left,y=q.top-r.top;return{x,y,w:q.width,h:q.height,cx:x+q.width/2,cy:y+q.height/2}}
  /* layout rect: ignores theme scale/translate, includes FLIP offset */
  size(){return{w:this.el.clientWidth,h:this.el.clientHeight}}
  set(k,v){
    if(this.el.dataset[k]===v)return;
    const before=this.btns.map(b=>b.getBoundingClientRect().left);const bW=this.btns.map(b=>b.offsetWidth);
    const oldAlign=this.el.dataset.align;
    this.el.dataset[k]=v;
    const after=this.btns.map(b=>b.getBoundingClientRect().left);
    const cs=getComputedStyle(this.el);
    const dur=parseFloat(cs.getPropertyValue('--flip-dur'))||640,ease=cs.getPropertyValue('--flip-ease').trim()||'cubic-bezier(.2,.8,.2,1)';
    const stag=parseFloat(cs.getPropertyValue('--flip-stagger'))||0;
    const dir=after[0]<before[0]?1:-1;
    this.btns.forEach((b,i)=>{const dx=before[i]-after[i];if(Math.abs(dx)<.5)return;
      const order=dir>0?i:this.btns.length-1-i;
      b.animate([{transform:`translateX(${dx}px)`},{transform:'translateX(0)'}],{duration:k==='content'?dur*.75:dur,delay:k==='content'?0:order*stag,easing:ease,fill:'backwards'})});
    if(k==='content'){this.btns.forEach((b,i)=>{const aw=b.offsetWidth,bw=bW[i];if(Math.abs(aw-bw)<.5)return;b.style.overflow='hidden';
      const a=b.animate([{width:bw+'px'},{width:aw+'px'}],{duration:dur*.75,easing:ease});a.onfinish=a.oncancel=()=>{b.style.overflow=''};
      b.querySelectorAll('.ic,.tl').forEach(e=>e.animate([{opacity:0,filter:'blur(5px)'},{opacity:1,filter:'blur(0px)'}],{duration:420,delay:dur*.3+i*30,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}))})}
    this.fxi.layout&&this.fxi.layout();
    this.fxi.realign&&this.fxi.realign(k,v,oldAlign);
  }
}
let _last=performance.now();
function _loop(t){const dt=Math.max(0,Math.min(.05,(t-_last)/1000));_last=t;for(const tb of ALL){if(tb.visible&&tb.fxi.frame)tb.fxi.frame(dt,t/1000)}requestAnimationFrame(_loop)}

/* canvas helper sized to an element */
function fitCanvas(cv,el){const d=DPR(),w=el.clientWidth,hh=el.clientHeight;if(cv.width!==Math.round(w*d)||cv.height!==Math.round(hh*d)){cv.width=Math.round(w*d);cv.height=Math.round(hh*d)}const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,w,h:hh}}
function splitLetters(b){const tl=b.querySelector('.tl');const t=tl.textContent;tl.innerHTML=[...t].map(ch=>`<span class="ch">${ch===' '?'&nbsp;':ch}</span>`).join('');return $$('.ch',tl)}

/* ---------- page ---------- */
function boot(){
  const T=THEME;
  document.title=`W7 Toolbar · ${T.title}`;
  const app=$('#app');
  app.innerHTML=`<div class="wrap${T.hero?' has-hero':''}">
  ${T.hero?'<section class="hero"></section>':''}<header class="top"${T.hero?' hidden':''}><div><p class="eyebrow">IXD-404 · Week 7 · Toolbar · ${T.set||'Set '+T.num}</p><h1>${T.title}</h1><p class="tone">${T.blurb}</p></div>
  <div class="toneword"><span>Tone</span><b>${T.tone}</b>${T.ver?`<span class="ver">${T.ver}</span>`:''}</div></header>
  <section class="sec"><div class="sec-h"><h2>Prototype</h2><span>Hover · press · re-align · swap content</span></div>
    <div class="dstage"><div class="win"><div class="tbar"><i></i><i></i><i></i><b>${T.app||T.title}</b></div><div class="wtb"></div>
      <div class="wbody"><div class="wb"><span class="wb-k">Active tool</span><b class="wb-v">Select</b><span class="wb-s">${T.idleNote||'Pick a tool from the toolbar'}</span></div><div class="toast"></div></div></div>
      <div class="ctrls">
        <div class="seg" data-k="align"><span>Align</span><button data-v="left" aria-pressed="true">Left</button><button data-v="center">Center</button><button data-v="right">Right</button></div>
        <div class="seg" data-k="content"><span>Button</span><button data-v="icon">Icon</button><button data-v="text">Text</button><button data-v="both" aria-pressed="true">Icon + Text</button></div>
      </div><p class="hint">${T.hint}</p></div></section>
  ${T.anatomy?'<section class="sec"><div class="sec-h"><h2>Anatomy</h2><span>The layers, pulled apart</span></div><div class="anat"></div></section>':''}
  <section class="sec"><div class="sec-h"><h2>States</h2><span>Enabled · Hover · Pressed — shown on the 2nd button</span></div><div class="grid3" id="states"></div></section>
  <section class="sec"><div class="sec-h"><h2>System</h2><span>One structure · alignment × button type</span></div><div class="grid2" id="system"></div></section>
  <section class="sec"><div class="sec-h"><h2>Spec</h2><span>Measured live from the component</span></div><div class="spec"><div class="pv specpv" id="specpv"><svg class="rl"></svg></div><table class="tbl" id="spectbl"></table></div></section>
  </div>`;
  const toast=$('.toast'),wbv=$('.wb-v'),wbs=$('.wb-s');let tt;
  const main=new Toolbar($('.wtb'),{main:true,onAction:(it)=>{if(T.setLabel)T.setLabel(it.label,wbv);else wbv.textContent=it.label;wbs.textContent=(T.actNote?T.actNote(it):`${it.label} tool active`);toast.textContent=T.toast?T.toast(it):it.label;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1400)}});
  window.MAIN=main;
  main.btns.forEach((b,i)=>b.animate([{opacity:0,transform:'translateY(10px)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0px)'}],{duration:900,delay:300+i*80,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}));
  T.body&&T.body($('.wbody'),main);T.setLabel&&T.setLabel('Select',wbv,true);
  $$('.seg').forEach(seg=>seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('button',seg).forEach(x=>x.setAttribute('aria-pressed',x===b));main.set(seg.dataset.k,b.dataset.v)}));

  T.hero&&T.hero($('.hero'));T.anatomy&&T.anatomy($('.anat'));
  const three=ITEMS.slice(0,3);
  [['Enabled','default',null],['Hover','pointer over',{i:1}],['Pressed','pointer down',{i:1,press:true}]].forEach(([n,s,f],k)=>{
    const c=h('div','cell',`<p class="cap"><span>${n}</span><i>${s}</i></p>`);const pv=h('div','pv');c.appendChild(pv);$('#states').appendChild(c);if(T.stateNotes)c.appendChild(h('p','note',T.stateNotes[k]));
    new Toolbar(pv,{items:three,forced:f,still:!f});
  });

.insp .wb-v{font-size:46px;font-weight:400;justify-content:flex-start}
.insp .wb-v.melting{filter:url(#goo-sm)}
.insp dl{margin:0;display:flex;flex-direction:column;gap:0;font:400 11px/1 var(--f-mono)}
.insp dl div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #161616}
.insp dt{color:#6a6a6a;letter-spacing:.08em}.insp dd{margin:0;color:#e8e8e8}
.insp .sw2{margin-top:auto;display:flex;gap:6px}.insp .sw2 i{flex:1;height:22px;border-radius:11px;background:#cfcfcf}.insp .sw2 i:nth-child(2){background:#fff}.insp .sw2 i:nth-child(3){background:#000;box-shadow:inset 0 0 0 1px #333}
/* anatomy */
.an{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:center;background:var(--stage);padding:24px 32px}
@media(max-width:900px){.an{grid-template-columns:1fr}}
.an-stage{height:440px;perspective:1700px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.an-stack{position:relative;width:min(640px,100%);height:80px;transform:rotateX(56deg) rotateZ(-16deg);transform-style:preserve-3d}
.an-l{position:absolute;inset:0;transform:translateZ(calc(var(--i)*78px - 78px));transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s;transform-style:preserve-3d}
.an-l::after{content:attr(data-n);position:absolute;left:-46px;top:50%;translate:0 -50%;font:500 11px/1 var(--f-mono);color:#6a6a6a}
.an.focus .an-l{opacity:.25}.an.focus .an-l.on{opacity:1;transform:translateZ(calc(var(--i)*78px - 48px))}
.an-l[data-l="1"] .tb-fx,.an-l[data-l="1"] .tb-row{visibility:hidden}
.an-l[data-l="2"] .tb-bg,.an-l[data-l="2"] .tb-row,.an-l .glint{visibility:hidden}
.an-l[data-l="2"] .tb-fx{visibility:visible}
.an-l[data-l="3"] .tb-bg,.an-l[data-l="3"] .tb-fx{visibility:hidden}
.an-l[data-l="3"] .tbi{mix-blend-mode:normal;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.an-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.an-list li{display:grid;grid-template-columns:40px 1fr;gap:4px;padding:18px 0;border-bottom:1px solid var(--line);cursor:default;transition:opacity .4s}
.an-list b{font:500 11px/1.6 var(--f-mono);color:#6a6a6a}
.an-list h3{margin:0 0 6px;font:400 20px/1.2 var(--f-disp);letter-spacing:-.01em}
.an-list p{margin:0;font:400 13px/1.55 var(--f-body);color:var(--muted)}
.an.focus .an-list li:not(.on){opacity:.4}
</style>
